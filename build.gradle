plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

group 'com.dongqing.plugin'
version '5.2'

repositories {
    mavenCentral()
    
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    
    intellijPlatform {
        // 使用本地 Android Studio 安装以避免远程依赖解析问题
        local("/Users/zhoujiawei/Applications/Android Studio.app")
        
        // Add necessary plugin dependencies for compilation here
        bundledPlugin("com.intellij.java")
        bundledPlugin("com.intellij.gradle")
        bundledPlugin("org.jetbrains.kotlin")
        
        // Add instrumentation tools required for build
        instrumentationTools()
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = "251"
        }

      /*  changeNotes = """
            Initial version
        """.trimIndent()*/
    }
}


